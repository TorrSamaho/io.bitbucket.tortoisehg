app-id: io.bitbucket.tortoisehg

runtime: org.kde.Platform
runtime-version: "6.8"
sdk: org.kde.Sdk

base: com.riverbankcomputing.PyQt.BaseApp
base-version: "6.8"

command: thg

cleanup-commands:
  - /app/cleanup-BaseApp.sh
build-options:
  env:
    - BASEAPP_REMOVE_PYWEBENGINE=1
    
finish-args:
  - --device=dri
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=ssh-auth
  - --share=network
  - --share=ipc
  - --filesystem=home:rw
  # For external differs
  - --talk-name=org.freedesktop.Flatpak
  # For external differs
  - --filesystem=/tmp

modules:
  # https://github.com/flathub/page.codeberg.JakobDev.jdTextEdit/blob/master/page.codeberg.JakobDev.jdTextEdit.yaml
  - name: qscintilla-pyqt6
    buildsystem: simple
    build-commands:
      - sip-install --target-dir=/app/lib/python/site-packages/ --verbose --debug
    sources:
      - type: archive
        url: https://files.pythonhosted.org/packages/e8/06/799c04a51f6cc2111f0cfb090ed4938fc044c5c12d1d9671280e235f2f2e/PyQt6_QScintilla-2.14.1.tar.gz
        sha256: 8849a4a9847bbf3698d0c1cf47e6d08552a49a66928543a73f10d6dcba617d10
        x-checker-data:
          type: pypi
          name: PyQt6-QScintilla
          packagetype: sdist
  # Generated with "./flatpak-pip-generator mercurial\<6.10"
  - python3-mercurial.json
  # Generated with "./flatpak-pip-generator hg-evolve"
  - python3-hg-evolve.json
  # Generated with "./flatpak-pip-generator iniparse"
  - python3-iniparse.json
  - name: tortoisehg
    buildsystem: simple
    build-commands:
      - pip3 install --prefix=${FLATPAK_DEST} .
    sources:
      - type: archive
        url: https://www.mercurial-scm.org/release/tortoisehg/targz/tortoisehg-6.9.tar.gz
        sha256: 8fe1ee02afde9675c83a85f87a8a8c78ec86ab7aa36dda09c3aa5c66c49af802
      - type: file
        path: io.bitbucket.tortoisehg.metainfo.xml
    post-install:
      - (cd icons && find . -type f -exec install -Dm 755 "{}" "${FLATPAK_DEST}/share/icons/hicolor/{}" \;)
      - install -Dm644 icons/svg/thg_logo.svg ${FLATPAK_DEST}/share/icons/hicolor/scalable/apps/${FLATPAK_ID}.svg
      - sed -e "s|Icon=thg_logo|Icon=${FLATPAK_ID}|g" contrib/thg.desktop > ${FLATPAK_ID}.desktop
      - install -Dm644 ${FLATPAK_ID}.desktop -t ${FLATPAK_DEST}/share/applications
      - install -Dm644 ${FLATPAK_ID}.metainfo.xml -t ${FLATPAK_DEST}/share/metainfo
